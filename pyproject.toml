[project]
name = "relay-company-brain"
version = "0.1.0"
description = "Evidence-backed company intelligence and Ripple scenario analysis on FalkorDB"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "falkordb>=1.8,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pypdf>=6.21,<7",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=25,<26",
]

[project.optional-dependencies]
ingestion = ["graphrag-sdk[litellm,pdf]>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
